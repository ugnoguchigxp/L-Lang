name: Core quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test
        if: runner.os != 'Windows'
        run: bun test --timeout 30000
        env:
          OPENAI_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""

      - name: Test in bounded shards
        if: runner.os == 'Windows'
        run: bun run test:sharded
        env:
          OPENAI_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""

      - name: Run offline CLI smoke checks
        run: bun run ci:smoke
        env:
          OPENAI_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""

  quality:
    name: Quality and coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Verify documentation links
        run: bun run ci:docs

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run coverage
        env:
          OPENAI_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""

      - name: Verify protected benchmark inputs
        run: bun run ci:protected
