name: Core quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run coverage
        env:
          OPENAI_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""

      - name: Run offline CLI smoke checks
        run: bun run ci:smoke
        env:
          OPENAI_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""

      - name: Verify protected benchmark inputs
        run: bun run ci:protected
