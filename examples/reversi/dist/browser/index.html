<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月夜のリバーシ</title><link rel="stylesheet" href="/style.css"></head><body><main><header><p class="eyebrow">あなた vs コンピューター</p><h1>月夜のリバーシ</h1><p id="status" aria-live="polite">読み込み中…</p></header><section class="score"><span>● 黒 <b id="black">2</b></span><span>○ 白 <b id="white">2</b></span><button id="undo" disabled>一手戻す</button><button id="restart" disabled>最初から</button></section><div id="board" class="board" role="group" aria-label="リバーシ盤"></div><p id="error" role="alert" hidden></p><button id="retry" hidden>もう一度試す</button><p class="hint">緑の点は置ける場所です。あなたは黒です。</p></main><script type="module" src="/bridge.js"></script></body></html>
