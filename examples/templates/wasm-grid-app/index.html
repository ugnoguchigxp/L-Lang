<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲーム</title><link rel="stylesheet" href="/template.css"><link rel="stylesheet" href="/style.css"></head>
<body><main class="game-shell"><header><p class="eyebrow">MOONLIGHT ARCADE</p><h1 id="title">読み込み中</h1><p id="subtitle"></p></header><div class="game-layout"><section class="board-panel"><div id="board" role="img" tabindex="0" aria-label="ゲーム盤面"></div></section><aside class="sidebar"><section class="next-panel"><h2>次のブロック</h2><div id="preview" role="img" aria-label="次のブロック"></div></section><dl class="stats"><div><dt>スコア</dt><dd id="score">0</dd></div><div><dt>ライン</dt><dd id="lines">0</dd></div><div><dt>レベル</dt><dd id="level">1</dd></div></dl><p id="status" role="status" aria-live="polite">読み込み中</p><button id="restart" disabled>新しいゲーム</button><p id="error" role="alert" hidden></p><button id="retry" hidden>再読み込み</button><nav id="controls" aria-label="ゲーム操作"></nav></aside></div><p class="keyboard-help">← → 移動 · ↓ 落下 · ↑ 回転 · Z 逆回転 · Space 一気に落下 · P 一時停止</p><p class="footer-note">ひと息ついて、次の一手を。</p></main><script type="module" src="/browser.js"></script></body>
</html>
